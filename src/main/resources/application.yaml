server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: order-processing-system

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orders_db}?sslmode=${DB_SSLMODE:prefer}}
    username: ${DB_USER:orders_user}
    password: ${DB_PASS:orders_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:1}
      connection-timeout: 20000
      max-lifetime: 300000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
      ssl.endpoint.identification.algorithm: ${KAFKA_SSL_ENDPOINT_ALGORITHM:}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual_immediate
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true

orders:
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
  kafka:
    topic-partitions: ${KAFKA_TOPIC_PARTITIONS:1}
    retry:
      max-attempts: ${KAFKA_RETRY_MAX_ATTEMPTS:3}
      initial-interval-ms: ${KAFKA_RETRY_INITIAL_INTERVAL_MS:1000}
      multiplier: ${KAFKA_RETRY_MULTIPLIER:2.0}
      max-interval-ms: ${KAFKA_RETRY_MAX_INTERVAL_MS:10000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,https://*.vercel.app}
  jwt:
    secret: ${JWT_SECRET:OrderFlowSuperSecretKeyForJwtSigning2026!@#}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
